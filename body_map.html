<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D6D6D3">
<title>Body Map</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#181818;--ink2:#6b6b6b;--ink3:#9b9b9b;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--grad:#3d3d3a;--ember:#e14b4b;--sans:'EB Garamond',Georgia,serif;--mono:'JetBrains Mono',monospace}
html{background:#D6D6D3}
body{min-height:100svh;background:#D6D6D3;color:var(--ink);font-family:var(--sans)}
.app{width:min(100%,460px);margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
.back{display:inline-block;margin:0 4px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-decoration:none;padding:6px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 18px}
.head h1{font-size:30px;font-weight:600;line-height:1.05}
.head span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(200%);-webkit-backdrop-filter:blur(22px) saturate(200%);border-radius:22px;border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 24px rgba(40,46,50,.08)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin-bottom:14px;border-radius:999px}
.seg button{border:0;background:none;padding:9px 0;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;font-weight:700}
.stage{padding:10px 6px 6px;margin-bottom:14px}
.stage svg{display:none;width:100%;height:auto;max-height:64svh}
.stage svg.on{display:block}
svg .shape{fill:rgba(255,255,255,.35);stroke:#3d3d3a;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:fill .15s,stroke-width .15s}
svg .deco{fill:none;stroke:#3d3d3a;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.55;pointer-events:none}
svg .dash{stroke-dasharray:3 3}
svg .hit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
svg [data-k]{cursor:pointer;outline:none}
svg [data-k]:hover .shape,svg [data-k].on .shape{fill:rgba(61,61,58,.18)}
svg [data-k].on .shape{stroke-width:2.2}
svg .lead{stroke:#3d3d3a;stroke-width:.8;opacity:.45;fill:none}
svg .skin{fill:#F5F5F3;stroke:#3d3d3a;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;transition:fill .15s}
svg .hairfill{fill:#E2E1DD;stroke:#3d3d3a;stroke-width:1.3;stroke-linejoin:round;transition:fill .15s}
svg .strand{fill:none;stroke:#3d3d3a;stroke-width:.9;stroke-linecap:round;opacity:.32;pointer-events:none}
svg .fine{fill:none;stroke:#3d3d3a;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;opacity:.6;pointer-events:none}
svg .lid{fill:none;stroke:#181818;stroke-width:2.1;stroke-linecap:round;pointer-events:none}
svg .brow{fill:#3d3d3a;stroke:none;pointer-events:none;opacity:.85}
svg .eyew{fill:#fff;stroke:#3d3d3a;stroke-width:1;transition:fill .15s}
svg .lip{fill:#ECEBE8;stroke:#3d3d3a;stroke-width:1.3;stroke-linejoin:round;transition:fill .15s}
svg .tooth{fill:#fff;stroke:#3d3d3a;stroke-width:.9;transition:fill .15s}
svg .zline{fill:none;stroke:#3d3d3a;stroke-width:1.4;stroke-dasharray:3 3;stroke-linecap:round;pointer-events:none}
svg .zhit{fill:none;stroke:transparent;stroke-linecap:round;pointer-events:stroke;cursor:pointer}
svg .ldot{fill:#3d3d3a;opacity:.55}
svg [data-k]:hover .skin,svg [data-k].on .skin{fill:#DCDBD7}
svg [data-k]:hover .hairfill,svg [data-k].on .hairfill{fill:#C9C8C3}
svg [data-k]:hover .eyew,svg [data-k].on .eyew{fill:#DCDBD7}
svg [data-k]:hover .lip,svg [data-k].on .lip{fill:#C6C5C1}
svg [data-k]:hover .tooth,svg [data-k].on .tooth{fill:#BDBCB8}
svg [data-k].on .skin,svg [data-k].on .hairfill,svg [data-k].on .lip{stroke-width:2}
svg [data-k]:hover .zline,svg [data-k].on .zline{stroke-width:3.2;stroke-dasharray:none}
svg .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;fill:#6b6b6b;text-transform:uppercase}
svg g.lbg.on .lb,svg g.lbg:hover .lb{fill:#181818;font-weight:700}
svg g.lbg.on .lead{opacity:1}
.info{padding:18px 18px 16px;margin-bottom:14px}
.i-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.i-st.fix{color:var(--ember);font-weight:700}
.i-name{font-size:26px;font-weight:600;margin:6px 0 10px}
.i-row{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.i-row b{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding-top:3px}
.i-row .empty{color:var(--ink2)}
.open{display:flex;justify-content:center;align-items:center;margin-top:12px;min-height:46px;border-radius:14px;background:var(--grad);color:#fff;text-decoration:none;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.open.off{opacity:.35;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:14px}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.5);border-radius:999px;padding:7px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--grad);border-color:var(--grad);color:#fff;font-weight:700}
.chip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-right:6px;vertical-align:1px}
.legend{padding:10px 4px 0;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink3)}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-right:6px}
</style>
</head>
<body>

      <g class="lbg" data-k="eyes"><line class="lead" x1="26" y1="166" x2="109" y2="166"/><circle class="ldot" cx="109" cy="166" r="1.8"/><text class="lb" x="-12" y="169" text-anchor="start">Eyes</text></g>
      <g class="lbg" data-k="face"><line class="lead" x1="272" y1="212" x2="229" y2="212"/><circle class="ldot" cx="229" cy="212" r="1.8"/><text class="lb" x="332" y="215" text-anchor="end">Face skin</text></g>

<script>
// Static snapshot of the Notion "Body Parts" database (Body Map.). Edit URLs/text here if pages change.
const N='https://app.notion.com/p/';
const P={
 eyes:{name:'Eyes',zone:'Head',view:'face',status:'Fix now',goal:'눈 수분 개선 (건조 완화)',now:'렌즈 착용 (최대 8시간) · 보존제 없는 1회용 습윤 점안액 사용 중',url:N+'400d6b58c4ff81c7a9c4dd4130d0d0ff'},
 scalp:{name:'Scalp',zone:'Head',view:'face',status:'Fix now',goal:'수분 · 탄력 · 모발',now:'PDRN 앰플 (수건으로 말린 두피에)',url:N+'400d6b58c4ff8103a3d7ced55fda5e74'},
 hair:{name:'Hair',zone:'Head',view:'face',status:'',goal:'',now:'샴푸 → 컨디셔너(중간~끝만) → 찬물 헹굼 · 헤어마스크 주 2–3회 · 모로칸 오일(끝)',url:N+'400d6b58c4ff812a9efec07936f84edb'},
 face:{name:'Face skin',zone:'Face',view:'face',status:'',goal:'',now:'AM: 클렌저 → 토너 → 세럼 → 보습 → 선크림 · PM: 더블클렌징 → 토너 → 세럼 → 레티놀(주 3–4회) → 보습',url:N+'400d6b58c4ff8115977bd0500d864bfc'},
 lips:{name:'Lips',zone:'Face',view:'face',status:'',goal:'',now:'립밤 또는 슬리핑 마스크',url:N+'400d6b58c4ff81bb9bf0ee95a2d8406e'},
 jaw:{name:'Jaw',zone:'Face',view:'face',status:'',goal:'',now:'Jaw + eye + scalp massager 주 4회 (림프 흐름 루트)',url:N+'400d6b58c4ff81d485fbd0983a2adf53'},
 teeth:{name:'Teeth',zone:'Face',view:'face',status:'',goal:'',now:'치실 → 양치 · 미백 · 리테이너',url:N+'400d6b58c4ff81a098b2f8389a34f271'},
 back:{name:'Back',zone:'Body',view:'back',status:'',goal:'',now:'등 브러시 · 등 여드름 케어 (Acnon 또는 BHA 바디워시)',url:N+'400d6b58c4ff81d79baaf7eb4a7c627f'},
 underarms:{name:'Underarms',zone:'Body',view:'front',status:'',goal:'',now:'나이아신아마이드 (착색 완화) · Driclor 주 2–3회',url:N+'400d6b58c4ff817d8ff2fd1bb0ce6077'},
 whole:{name:'Whole body',zone:'Body',view:'front',status:'',goal:'',now:'AM / PM 서플리먼트',url:N+'400d6b58c4ff8147a4d9e310a2bebe54'}
};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showView(v){$$('.stage svg').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function select(k){
  const p=P[k];if(!p)return;
  showView(p.view);
  $$('[data-k]').forEach(e=>e.classList.toggle('on',e.dataset.k===k));
  $$('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k));
  $('#info').innerHTML=
   '<div class="i-top"><span>'+esc(p.zone)+'</span><span class="i-st '+(p.status==='Fix now'?'fix':'')+'">'+esc(p.status||'')+'</span></div>'+
   '<h2 class="i-name">'+esc(p.name)+'</h2>'+
   '<div class="i-row"><b>Goal</b><span class="'+(p.goal?'':'empty')+'">'+(p.goal?esc(p.goal):'아직 안 적음')+'</span></div>'+
   '<div class="i-row"><b>Now</b><span>'+esc(p.now)+'</span></div>'+
   '<a class="open" target="_blank" rel="noopener" href="'+p.url+'">Open in Notion ↗</a>';
}
$('#info').innerHTML='<div class="i-top"><span>Body Map</span><span></span></div><h2 class="i-name">Tap a zone</h2><div class="i-row"><b>Tip</b><span class="empty">눈, 두피, 입술… 부위를 누르면 목표와 지금 하는 것이 나오고, 버튼으로 Notion 페이지가 열려요.</span></div><a class="open off">Open in Notion ↗</a>';
$('#chips').innerHTML=Object.keys(P).map(k=>'<button type="button" class="chip" data-k="'+k+'">'+(P[k].status==='Fix now'?'<i></i>':'')+esc(P[k].name)+'</button>').join('');
$$('#seg button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.v)));
document.addEventListener('click',e=>{const el=e.target.closest('[data-k]');if(el)select(el.dataset.k)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.k){e.preventDefault();select(e.target.dataset.k)}});
</script>
</body>
</html>
